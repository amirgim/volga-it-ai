name: plate-recognition-broke

x-base: &base
  build:
    context: .
    dockerfile: Dockerfile.broke
  image: plate-recognition-broke:latest
  working_dir: /app
  volumes:
    - .:/app
  environment:
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  stdin_open: true
  tty: true

# infer works out of the box on dataset/images/real (always present).
# To run on test_images/ use:
#   docker compose -f docker-compose.broke.yml run --rm infer \
#     python -m broke.run --input test_images --output result.csv
services:
  generate:
    <<: *base
    command: python -m broke.make_synthetic --n 5000 --seed 42

  infer:
    <<: *base
    command: python -m broke.run --input dataset/images/real --output result.csv

  fetch:
    <<: *base
    command: python scripts/fetch_open_plates.py --limit 200

  shell:
    <<: *base
    command: bash

  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    image: plate-recognition-train:latest
    working_dir: /app
    volumes:
      - .:/app
    environment:
      PYTHONUNBUFFERED: "1"
    # ultralytics dataloader uses /dev/shm; default 64MB is too small
    shm_size: "2gb"
    stdin_open: true
    tty: true
    command: bash
